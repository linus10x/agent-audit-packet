[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit-packet"
version = "0.1.0"
description = "Forwardable, one-command OFAC audit packet wrapping the proven agent-funds-gate control."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor"]
testpaths = ["tests"]
